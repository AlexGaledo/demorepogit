<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git Demo Page</title>
  <style>
    :root {
      --bg: #0f172a;      /* change me per branch */
      --accent: #38bdf8;  /* change me per branch */
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    h1 { font-size: 2.5rem; margin: 0 0 .5rem; }
    .tag {
      display: inline-block;
      padding: .3rem .8rem;
      border-radius: 999px;
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
    }
    p { opacity: .8; }
  </style>
</head>
<body>
  <main>
    <h1>Hi, I'm Your Name</h1>
    <span class="tag">branch: main</span>
  </main>
</body>
</html>
